# Apache settings for the site, without HTTPS (DEPLOY.md, step 11).
# Visitors connect to Apache on port 80. Apache passes their requests on to
# the site, which runs on port 3000 and can only be reached from the server
# itself.
<VirtualHost *:80>
    ProxyPreserveHost On

    # Used to get an HTTPS certificate (step 14). Everything else goes to the site.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>
