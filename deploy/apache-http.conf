# Apache settings for the site (DEPLOY.md, step 7).
# Visitors connect to Apache on port 80; Apache passes every request on to
# the site, which runs on port 3000 and can only be reached from the server.
<VirtualHost *:80>
    # Used later to get the free HTTPS certificate (step 9).
    DocumentRoot /var/www/html
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>
