# Apache settings for the site, with HTTPS (DEPLOY.md, step 14).
# SITE_ADDRESS is replaced with the real address during that step.

# Plain http:// visits (also by IP address) are sent to the https:// address.
<VirtualHost *:80>
    ServerName SITE_ADDRESS

    # Used to renew the HTTPS certificate.
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://SITE_ADDRESS%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName SITE_ADDRESS

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/SITE_ADDRESS/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/SITE_ADDRESS/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>
