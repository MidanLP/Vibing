# Apache settings for the site with HTTPS (DEPLOY.md, step 9).
# SITE_HOST is replaced with the real address during that step.

# Every plain http:// visit (also by IP address) is sent to the https:// address.
<VirtualHost *:80>
    # Used to renew the HTTPS certificate.
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://SITE_HOST%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName SITE_HOST

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/SITE_HOST/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/SITE_HOST/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/inkwell-error.log
    CustomLog ${APACHE_LOG_DIR}/inkwell-access.log combined
</VirtualHost>
